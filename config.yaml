# ---------------------------------------------------------------
# Startup Hunter settings. Change these freely, no code changes needed.
# ---------------------------------------------------------------

# ---------------------------------------------------------------
# Where to look
# ---------------------------------------------------------------
# Supported countries: Austria, Belgium, Czechia, Denmark, Estonia, Finland,
# France, Germany, Ireland, Italy, Netherlands, Poland, Portugal, Spain, Sweden,
# Switzerland, United Kingdom. (Short forms like "de" or "uk" work too.)
country: Germany
city: Dresden

# Optional: the state/region and nearby towns that also count as "in the area".
# A company only counts if its website mentions the city or one of these.
# Add the local spelling too if it differs (e.g. "München" for Munich).
nearby: ["Sachsen", "Saxony", "Freital", "Radebeul", "Pirna"]

# The bot searches in English and in the country's language automatically.
# Add your own phrases here; {city} is filled in.
# Example:  extra_search_queries: ["{city} fintech startup", "{city} SaaS startup"]
extra_search_queries: []
max_search_results_per_query: 8

# Pages you already know list startups in your city (optional).
# Add any URL here and the bot will read it every run.
seed_pages: []

# Also check a free job board API for software jobs in your city.
# It only covers Germany, so it's switched off automatically elsewhere.
use_job_board: true
job_board_pages: 5

# Safety limits so one run stays quick and cheap.
max_pages_to_read_per_run: 30
max_new_companies_per_run: 25

# Only companies scoring at least this (0-10) get an email draft.
min_fit_score: 6

# Be polite to websites. The bot waits at least request_delay_seconds between
# any two requests, and site_delay_seconds between two pages of the same
# website (sites that ask for more in robots.txt get more).
request_delay_seconds: 3
site_delay_seconds: 5

# Who does the AI work (reading articles, scoring companies, writing drafts):
#   auto  - api if an API key is in .env, otherwise agent (recommended)
#   api   - the bot calls the provider below itself. Costs a few cents per run.
#   agent - no API key needed. The bot collects and reads websites for free, then
#           your coding assistant (Claude Code, Codex, Cursor...) does the scoring
#           and drafts on your existing subscription. See AGENTS.md.
ai_mode: auto

# For api mode: anthropic (Claude), openai (GPT) or google (Gemini).
# Put the matching API key in .env (see .env.example).
provider: anthropic

# Models per provider: a fast cheap one for reading/scoring, a better one
# for writing. Only the section for the provider above is used.
models:
  anthropic:
    fast: claude-haiku-5-5
    writer: claude-sonnet-5-5
  openai:
    fast: gpt-5-mini
    writer: gpt-5
  google:
    fast: gemini-2.5-flash
    writer: gemini-2.5-pro

# Language of the email drafts.
email_language: English

output:
  google_sheet_name: Startup Hunter
  google_credentials_file: google-credentials.json
  csv_path: data/startups.csv
  database_path: data/startups.db
